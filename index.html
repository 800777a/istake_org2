
<!DOCTYPE html>
<html lang="zh-TW">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Temple Trip Management System</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
      body {
        font-family: 'Noto Sans TC', sans-serif;
        background-color: #f3f4f6;
      }
      /* Force inputs to be readable on mobile regardless of theme defaults */
      @media (max-width: 768px) {
        input, select, textarea {
          background-color: #ffffff !important;
          color: #000000 !important;
        }
      }
      /* Prevent table header text from wrapping globally */
      th, td {
        white-space: nowrap;
      }
      /* 強制手機版下拉選單文字為黑色 */
      .force-black-text .ant-select-item-option-content {
        color: #000000 !important;
      }
      .force-black-text .ant-select-item-option-selected .ant-select-item-option-content {
        color: #000000 !important;
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./index.tsx"></script>
  </body>
</html>
